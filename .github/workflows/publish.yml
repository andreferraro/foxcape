# Publish foxcape to PyPI on version tags (GitFlow release → main).
#
# One-time setup (T026): https://pypi.org/manage/project/foxcape/settings/publishing/
#   - Add Trusted Publisher: GitHub
#   - Owner: andreferraro
#   - Repository: foxcape
#   - Workflow: publish.yml
#   - Environment: (leave blank for tag-based publishing)

name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Run offline tests
        run: uv run pytest

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

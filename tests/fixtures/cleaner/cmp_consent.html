<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Privacy Compliant Web Portal</title>
    <script src="https://cdn.cookielaw.org/scripttemplates/otSDKStub.js" data-document-language="true" type="text/javascript" charset="UTF-8" data-domain-script="onetrust-dummy-id"></script>
    <script id="Cookiebot" src="https://consent.cookiebot.com/uc.js" data-cbid="cookiebot-dummy-id" type="text/javascript"></script>
</head>
<body>
    <!-- OneTrust Banner -->
    <div id="onetrust-consent-sdk">
        <div id="onetrust-banner-sdk" class="ot-sdk-container" role="region" aria-label="Cookie Banner">
            <div class="ot-sdk-row">
                <p>We use cookies to improve your experience and analyze traffic.</p>
                <button id="onetrust-accept-btn-handler">Accept All</button>
            </div>
        </div>
    </div>

    <!-- Generic GDPR / Cookie Banner -->
    <div id="cookie-consent" class="cookie-banner cc-window">
        <span>We respect your privacy under GDPR and LGPD.</span>
    </div>

    <main>
        <h1>Welcome to the Knowledge Base</h1>
        <p>This repository provides architectural guidelines for resilient and ethical scraping pipelines.</p>
    </main>
</body>
</html>
